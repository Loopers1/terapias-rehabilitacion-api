<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Terapias y Rehabilitación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
        }

        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 13px;
                opacity: 0.85;
                margin-top: 4px;
            }

        .nav {
            background: #1557b0;
            display: flex;
            gap: 2px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

            .nav button {
                background: none;
                border: none;
                color: white;
                padding: 13px 16px;
                cursor: pointer;
                font-size: 13px;
                border-bottom: 3px solid transparent;
                transition: all 0.2s;
            }

                .nav button:hover, .nav button.active {
                    border-bottom: 3px solid #fff;
                    background: rgba(255,255,255,0.15);
                }

        .content {
            padding: 25px;
        }

        .section {
            display: none;
        }

            .section.active {
                display: block;
            }

        .card {
            background: white;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

            .card h2 {
                color: #1a73e8;
                margin-bottom: 15px;
                font-size: 17px;
                border-bottom: 2px solid #e8f0fe;
                padding-bottom: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-top: 4px solid #1a73e8;
        }

            .stat-card.verde {
                border-top-color: #34a853;
            }

            .stat-card.naranja {
                border-top-color: #fb8c00;
            }

            .stat-card.rojo {
                border-top-color: #ea4335;
            }

        .stat-number {
            font-size: 38px;
            font-weight: bold;
            color: #1a73e8;
        }

        .stat-card.verde .stat-number {
            color: #34a853;
        }

        .stat-card.naranja .stat-number {
            color: #fb8c00;
        }

        .stat-card.rojo .stat-number {
            color: #ea4335;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .dos-col {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
        }

        .tres-col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .dos-col-igual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #1a73e8;
            color: white;
            padding: 11px 12px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tr:hover td {
            background: #f8f9ff;
        }

        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: opacity 0.2s;
            display: inline-block;
        }

            .btn:hover {
                opacity: 0.85;
            }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-success {
            background: #34a853;
            color: white;
        }

        .btn-warning {
            background: #fb8c00;
            color: white;
        }

        .btn-danger {
            background: #ea4335;
            color: white;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
        }

        .btn-full {
            width: 100%;
            padding: 11px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 13px;
        }

            .form-group label {
                display: block;
                font-size: 12px;
                color: #555;
                margin-bottom: 4px;
                font-weight: bold;
            }

            .form-group input, .form-group textarea, .form-group select {
                width: 100%;
                padding: 9px 11px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 13px;
            }

        .alerta {
            padding: 11px 14px;
            border-radius: 7px;
            margin-bottom: 13px;
            font-size: 13px;
            display: none;
        }

        .alerta-ok {
            background: #e6f4ea;
            color: #2e7d32;
            border: 1px solid #34a853;
        }

        .alerta-error {
            background: #fce8e6;
            color: #c62828;
            border: 1px solid #ea4335;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #888;
            font-style: italic;
        }

        .sin-datos {
            background: #fff8e1;
            color: #f57f17;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            text-align: center;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

            .modal-overlay.activo {
                display: flex;
            }

        .modal {
            background: white;
            border-radius: 12px;
            padding: 28px;
            width: 480px;
            max-height: 85vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- MODALES -->
    <div id="modal-paciente" class="modal-overlay">
        <div class="modal">
            <h3>Editar Paciente</h3>
            <input type="hidden" id="edit-pac-codigo-original">
            <div class="form-group"><label>Código</label><input type="text" id="edit-pac-codigo" readonly style="background:#f5f5f5"></div>
            <div class="form-group"><label>Nombre</label><input type="text" id="edit-pac-nombre"></div>
            <div class="form-group"><label>Apellido</label><input type="text" id="edit-pac-apellido"></div>
            <div class="form-group"><label>CI</label><input type="text" id="edit-pac-ci"></div>
            <div class="form-group"><label>Teléfono</label><input type="text" id="edit-pac-telefono"></div>
            <div class="modal-botones">
                <button class="btn btn-success btn-full" onclick="guardarPaciente()">Guardar Cambios</button>
                <button class="btn btn-danger" onclick="cerrarModal('modal-paciente')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <div class="header">
        <div>
            <h1>Sistema de Terapias y Rehabilitación</h1>
            <p>Hospital de Tercer Nivel - Módulo 11</p>
        </div>
        <div style="font-size:13px;opacity:0.8"><span id="fecha-actual"></span></div>
    </div>

    <!-- NAVEGACION -->
    <div class="nav">
        <button class="active" onclick="ir('dashboard',this)">Dashboard</button>
        <button onclick="ir('pacientes',this)">Pacientes</button>
        <button onclick="ir('terapeutas',this)">Terapeutas</button>
        <button onclick="ir('terapias',this)">Tipos de Terapia</button>
        <button onclick="ir('sesiones',this)">Sesiones</button>
        <button onclick="ir('planes',this)">Planes</button>
    </div>

    <div class="content">
        <!-- DASHBOARD -->
        <div id="dashboard" class="section active">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="s-pac">0</div>
                    <div class="stat-label">Pacientes Activos</div>
                </div>
                <div class="stat-card verde">
                    <div class="stat-number" id="s-ses">0</div>
                    <div class="stat-label">Sesiones Totales</div>
                </div>
            </div>
        </div>

        <!-- PACIENTES -->
        <div id="pacientes" class="section">
            <div class="dos-col">
                <div class="card">
                    <h2>Nuevo Paciente</h2>
                    <div id="al-pac" class="alerta"></div>
                    <div class="form-group"><label>Código</label><input type="text" id="n-pac-cod"></div>
                    <div class="form-group"><label>Nombre</label><input type="text" id="n-pac-nom"></div>
                    <div class="form-group"><label>Apellido</label><input type="text" id="n-pac-ape"></div>
                    <div class="form-group"><label>CI</label><input type="text" id="n-pac-ci"></div>
                    <div class="form-group"><label>Teléfono</label><input type="text" id="n-pac-tel"></div>
                    <button class="btn btn-success btn-full" onclick="crearPaciente()">Registrar</button>
                </div>
                <div class="card">
                    <h2>Lista de Pacientes</h2>
                    <div id="t-pac"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://localhost:7187/api';

        document.getElementById('fecha-actual').textContent = new Date().toLocaleDateString();

        function ir(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if (id === 'pacientes') cargarPacientes();
        }

        function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); }
        function abrirModal(id) { document.getElementById(id).classList.add('activo'); }

        function mostrarAlerta(id, msg, ok) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `alerta ${ok ? 'alerta-ok' : 'alerta-error'}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        async function cargarPacientes() {
            try {
                const res = await fetch(`${API}/Paciente`);
                const datos = await res.json();
                let html = '<table><thead><tr><th>Código</th><th>Nombre</th><th>CI</th><th>Acciones</th></tr></thead><tbody>';
                datos.forEach(p => {
                    html += `<tr>
              <td>${p.codigo}</td>
              <td>${p.nombre} ${p.apellido}</td>
              <td>${p.ci}</td>
              <td>
                <button class="btn btn-warning btn-sm" onclick="prepararEdicion('${p.codigo}')">Editar</button>
                <button class="btn btn-danger btn-sm" onclick="eliminarPaciente('${p.codigo}')">Borrar</button>
              </td>
            </tr>`;
                });
                document.getElementById('t-pac').innerHTML = html + '</tbody></table>';
            } catch (e) {
                document.getElementById('t-pac').innerHTML = '<div class="sin-datos">Error de conexión</div>';
            }
        }

        async function crearPaciente() {
            const p = {
                codigo: document.getElementById('n-pac-cod').value,
                nombre: document.getElementById('n-pac-nom').value,
                apellido: document.getElementById('n-pac-ape').value,
                ci: document.getElementById('n-pac-ci').value,
                telefono: document.getElementById('n-pac-tel').value
            };
            const res = await fetch(`${API}/Paciente`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(p)
            });
            mostrarAlerta('al-pac', res.ok ? 'Registro exitoso' : 'Error al registrar', res.ok);
            if (res.ok) cargarPacientes();
        }

        async function eliminarPaciente(cod) {
            if (!confirm('¿Eliminar paciente?')) return;
            await fetch(`${API}/Paciente/${cod}`, { method: 'DELETE' });
            cargarPacientes();
        }

        async function prepararEdicion(cod) {
            const res = await fetch(`${API}/Paciente/${cod}`);
            const p = await res.json();
            document.getElementById('edit-pac-codigo-original').value = p.codigo;
            document.getElementById('edit-pac-codigo').value = p.codigo;
            document.getElementById('edit-pac-nombre').value = p.nombre;
            document.getElementById('edit-pac-apellido').value = p.apellido;
            document.getElementById('edit-pac-ci').value = p.ci;
            document.getElementById('edit-pac-telefono').value = p.telefono;
            abrirModal('modal-paciente');
        }

        async function guardarPaciente() {
            const cod = document.getElementById('edit-pac-codigo-original').value;
            const p = {
                codigo: cod,
                nombre: document.getElementById('edit-pac-nombre').value,
                apellido: document.getElementById('edit-pac-apellido').value,
                ci: document.getElementById('edit-pac-ci').value,
                telefono: document.getElementById('edit-pac-telefono').value
            };
            const res = await fetch(`${API}/Paciente/${cod}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(p)
            });
            if (res.ok) { cerrarModal('modal-paciente'); cargarPacientes(); }
        }
        async function cargarDashboard() {
            const res = await fetch(`${API}/Dashboard/Resumen`);
            const data = await res.json();
            document.getElementById('s-pac').textContent = data.totalPacientes;
            document.getElementById('s-ses').textContent = data.totalSesiones;
        }



        // Inicialización
        cargarPacientes();
    </script>

</body>
</html>
